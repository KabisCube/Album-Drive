name: Build Album Drive executables

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements/app.txt
            requirements/build.txt
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2 desktop-file-utils
      - run: python -m pip install -r requirements/build.txt
      - name: Check Qt runtime
        run: |
          python -c "import platform, PySide6, shiboken6; print('Python', platform.python_version(), 'PySide6', PySide6.__version__, 'shiboken6', shiboken6.__version__)"
          python -m unittest discover -s tests -p test_qt_runtime.py
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/test.py
      - name: Test source startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python src/main.py --smoke-test --smoke-report build/source-smoke.json
      - run: python scripts/build.py
      - name: Test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath './dist/AlbumDrive-windows-x86_64/AlbumDrive.exe' -ArgumentList '--smoke-test', '--smoke-report', 'build/smoke.json' -WindowStyle Hidden -Wait -PassThru
          Get-Content build/smoke.json
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Test Linux executable and launcher
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/AlbumDrive-linux-x86_64/AlbumDrive --smoke-test --smoke-report build/smoke.json
          QT_QPA_PLATFORM=offscreen XDG_DATA_HOME="$PWD/build/desktop-test" ./dist/AlbumDrive-linux-x86_64/AlbumDrive --install-desktop-entry
          desktop-file-validate build/desktop-test/applications/album-drive.desktop
          cat build/smoke.json
      - uses: actions/upload-artifact@v6
        with:
          name: AlbumDrive-${{ runner.os }}
          path: |
            dist/AlbumDrive-*.zip
            dist/AlbumDrive-*.tar.gz
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AlbumDrive-diagnostics-${{ runner.os }}
          path: |
            build/*smoke*.json
            build/pyinstaller/**/warn-AlbumDrive.txt
            build/logs/*.log
            dist/**/logs/*.log
          if-no-files-found: ignore

  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential git curl unzip zip ant autoconf automake libtool pkg-config cmake zlib1g-dev libffi-dev libssl-dev libltdl-dev patch ccache gettext
      - uses: actions/cache@v4
        with:
          path: ~/.cache/album-drive-android
          key: android-${{ hashFiles('scripts/setup_android.sh', 'packaging/android/requirements-build.txt') }}
      - run: bash scripts/setup_android.sh
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "Android signing secrets are missing. See tools/README.md."; exit 1; fi
          mkdir -p ~/.config/album-drive
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.config/album-drive/release.keystore
          printf '%s' "$ANDROID_KEY_PASSWORD" > ~/.config/album-drive/release-key-password.txt
      - run: python3 scripts/build_android.py --release
      - uses: actions/upload-artifact@v6
        with:
          name: AlbumDrive-Android
          path: dist/AlbumDrive-android-arm64.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -rf ~/.config/album-drive

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches APP_VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n "s/^APP_VERSION = '\(.*\)'.*/\1/p" src/app_identity.py)
          if [ "$version" != "$declared" ]; then echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $declared"; exit 1; fi
          notes="docs/release-notes/$version.md"
          if [ ! -s "$notes" ]; then echo "Missing $notes"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v6
        with:
          pattern: AlbumDrive-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${VERSION%%.*}" = "0" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/AlbumDrive-windows-*.zip release/AlbumDrive-linux-*.tar.gz release/AlbumDrive-android-arm64.apk \
            --title "Album Drive $GITHUB_REF_NAME" --notes-file "$NOTES" $prerelease
